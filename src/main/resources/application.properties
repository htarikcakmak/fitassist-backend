# ===============================
# TEMEL SUNUCU AYARLARI
# ===============================
spring.application.name=fitassist-backend

# ===============================
# POSTGRESQL VERİTABANI BAĞLANTI AYARLARI (GÜVENLİ)
# ===============================
# Şifreler GitHub'a gitmesin diye ${} ile çevre değişkenlerine bağladık.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driverClassName=org.postgresql.Driver

# ===============================
# HİBERNATE VE JPA AYARLARI
# ===============================
# GÜNCELLEME: "update" komutu "create" olarak değiştirildi. 
# Bu sayede boş veritabanında tablolar ilk kez sıfırdan oluşturulacak.
spring.jpa.hibernate.ddl-auto=create

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# RENDER CANLI SUNUCU PORT AYARI
# ===============================
server.port=${PORT:8080}